aid: resolution-games
name: Resolution Games
description: 'Resolution Games is a Stockholm-based studio building games for virtual,
  augmented, and mixed reality platforms including Meta Quest, Apple Vision Pro, and
  PlayStation VR. Its titles include Demeo, Spatial Ops, Blaston, Bait!, and Ultimechs.
  The company is venture-backed (Creandum, GV, Partech) and runs a consumer-facing
  games business. It publishes no public developer API, SDK, or developer portal;
  this API Evangelist profile tracks its public web properties (blog, support, legal
  pages) for discovery and enrichment.'
